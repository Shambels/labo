# Overrides for NVIDIA auto-ontology's own docker-compose.yml (cloned in ~/src/auto-ontology, commit a630ebd),
# used through ontology/ao.sh:
#
#   ontology/ao.sh up -d postgres auto-ontology ingestion-service frontend-migrate auto-ontology-frontend
#
# - Host network for the app containers: the model servers (8000-8002) run on the host, outside Docker, and this
#   machine's firewall drops traffic from Docker's bridge to host processes (published container ports still
#   work). With network_mode: host, localhost is the host: models, sources (5433, 5434, 5436, Trino 8080) and
#   auto-ontology's own PostgreSQL, published on POSTGRES_PORT=5435 (5432 is the course's).
# - pgAdmin (5050) is not started.
x-host: &host
  network_mode: host
  environment:
    POSTGRES_HOST: localhost
    POSTGRES_PORT: "5435"
    INGESTION_SERVICE_URL: http://localhost:3002
    PYTHON_API_URL: http://localhost:3001

services:
  auto-ontology:
    <<: *host
    ports: !reset []
  ingestion-service:
    <<: *host
    ports: !reset []
  auto-ontology-migrate:
    <<: *host
  frontend-migrate:
    <<: *host
  auto-ontology-frontend:
    <<: *host
    ports: !reset []

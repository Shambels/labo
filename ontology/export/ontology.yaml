- concept: PayElementLMentDePaie
  type: EntityType
  description: 'Les éléments d''une fiche de paie (salaire mensuel ou horaire, primes, commission, indemnité de télétravail,
    chèques-repas, ONSS, précompte...). gl_account est le compte comptable où l''élément est comptabilisé : c''est le lien
    entre la paie et la comptabilité (payslip_lines.element_code -> pay_elements.gl_account -> compta.ligne_ecriture.numero_compte).
    Plusieurs éléments partagent un même compte : comparer un élément à la comptabilité suppose que son compte ne contienne
    que lui, sinon comparer le total de tous les éléments du compte.'
  identify_by:
  - element_code
  relationships:
  - name: onss_subject
    description: A boolean flag indicating whether the specific payroll component is subject to National Social Security (ONSS)
      contributions for financial and legal compliance.
    roles:
    - concept: Boolean
    multiplicity: ManyToOne
    verbalizes:
    - '{PayElementLMentDePaie} has onss subject {Boolean}'
  - name: gl_account
    description: The General Ledger account code, such as '620300', used for posting the financial transaction associated
      with this specific payroll compensation component.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{PayElementLMentDePaie} has gl account {String}'
  - name: element_type
    description: The classification of the payroll element indicating whether it is a gain, net gain, retention, or informational
      item within compensation.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{PayElementLMentDePaie} has element type {String}'
  - name: label
    description: The human-readable French description detailing the specific nature of the payroll element, such as 'Salaire
      mensuel', for employee comprehension.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{PayElementLMentDePaie} has label {String}'
  - name: element_code
    description: The unique alphanumeric identifier for a payroll component, such as base salary, which is referenced by payslip
      lines to link specific compensation items.
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - '{PayElementLMentDePaie} is identified by element code {String}'
  - name: taxable
    description: A boolean flag indicating whether the specific payroll component is subject to personal income tax calculation
      during the payroll processing cycle.
    roles:
    - concept: Boolean
    multiplicity: ManyToOne
    verbalizes:
    - '{PayElementLMentDePaie} has taxable {Boolean}'

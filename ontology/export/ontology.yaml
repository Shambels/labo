version: 0.2.0.dev0
name: auto_ontology_model_ontology
description: Business concepts of the auto_ontology_model semantic model
ontology:
- concept: AbsenceType
  type: EntityType
  description: Definitions for different categories of employee absences, including whether they are paid by the employer
    and if meal vouchers apply.
  identify_by:
  - absence_code
  relationships:
  - name: absence_code
    description: Identifies the specific category of employee absence, serving as a unique reference for timesheet entries.
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - '{AbsenceType} is identified by absence code {String}'
  - name: label
    description: Provides the human-readable business name corresponding to a specific absence code for clear identification.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{AbsenceType} has label {String}'
  - name: paid_by_employer
    description: Indicates whether the employer covers the salary costs associated with a specific type of employee absence.
    roles:
    - concept: Boolean
    multiplicity: ManyToOne
    verbalizes:
    - '{AbsenceType} has paid by employer {Boolean}'
  - name: meal_voucher
    description: Indicates whether meal vouchers remain valid or payable during a specific category of employee absence.
    roles:
    - concept: Boolean
    multiplicity: ManyToOne
    verbalizes:
    - '{AbsenceType} has meal voucher {Boolean}'
- concept: AccountingEntryCritureComptable
  type: EntityType
  description: 'Écritures (pièces) par journal : VEN ventes (factures de l''ERP), ACH achats, BQ1 banque, SAL salaires, OD
    opérations diverses, AN à-nouveaux (reprise des soldes au 01/01/2025, pas une opération de l''exercice). statut BROUILLARD
    = provisoire, à exclure ; code_periode AAAA-MM.'
  identify_by:
  - entry_id
  relationships:
  - name: user
    description: Identifies the user account or automated process responsible for creating or modifying the entry.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryCritureComptable} has user {String}'
  - name: due_date
    description: Specifies the due date for settling the financial obligation, formatted as YYYY-MM-DD.
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryCritureComptable} has due date {Date}'
  - name: entry_date
    description: Indicates the calendar date the transaction was recorded in the ledger, formatted as YYYY-MM-DD.
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryCritureComptable} has entry date {Date}'
  - name: entry_timestamp
    description: Records the precise timestamp when the entry was inputted or imported, formatted as YYYY-MM-DD HH:MM:SS.
    roles:
    - concept: DateTime
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryCritureComptable} has entry timestamp {DateTime}'
  - name: status
    description: Indicates the entry's processing state, distinguishing between final approved records and drafts.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryCritureComptable} has status {String}'
  - name: external_reference
    description: References the original document number from source systems or partner invoices, like FA25-00012.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryCritureComptable} has external reference {String}'
  - name: document_number
    description: Identifies the specific invoice or accounting document via an alphanumeric code, such as AN-2025-00001.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryCritureComptable} has document number {String}'
  - name: description
    description: Provides a textual summary of the transaction nature, such as service interventions or balance carryovers.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryCritureComptable} has description {String}'
  - name: entry_id
    description: Uniquely identifies the accounting entry, linking it to associated amortization lines, journal details, and
      bank movements.
    roles:
    - concept: Integer
    multiplicity: OneToOne
    verbalizes:
    - '{AccountingEntryCritureComptable} is identified by entry id {Integer}'
  - name: third_party_tiers
    roles:
    - concept: ThirdPartyTiers
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryCritureComptable} has {ThirdPartyTiers}'
  - name: fiscal_period
    roles:
    - concept: FiscalPeriod
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryCritureComptable} has {FiscalPeriod}'
  - name: accounting_journal
    roles:
    - concept: AccountingJournal
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryCritureComptable} has {AccountingJournal}'
- concept: AccountingEntryLineLigneDCriture
  type: EntityType
  description: 'Lignes des écritures, au débit ou au crédit, montants toujours positifs. Classe du compte = premier chiffre
    de numero_compte : 6 charges (au débit), 7 produits (au crédit), 1 à 5 bilan. Ne compter que les écritures VALIDEE. Le
    compte 693000 (affectation du résultat) n''est pas une charge d''exploitation : il ramène le résultat à zéro en fin d''exercice.'
  relationships:
  - name: credit_amount
    description: Specifies the monetary amount recorded on the credit side of this particular accounting line.
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryLineLigneDCriture} has credit amount {Decimal}'
  - name: reconciliation_code
    description: Stores the code used for matching or clearing this specific accounting entry line.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryLineLigneDCriture} has reconciliation code {String}'
  - name: debit_amount
    description: Specifies the monetary amount recorded on the debit side of this particular accounting line.
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryLineLigneDCriture} has debit amount {Decimal}'
  - name: entry_line_id
    description: Uniquely identifies each individual line within the accounting entry table for technical record tracking.
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryLineLigneDCriture} has entry line id {Integer}'
  - name: description
    description: Contains the text description or label, such as invoice references, detailing the nature of this specific
      financial line.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryLineLigneDCriture} has description {String}'
  - name: reconciliation_date
    description: Records the date in YYYY-MM-DD format when this accounting entry line was matched or cleared.
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryLineLigneDCriture} has reconciliation date {Date}'
  - name: line_number
    description: Provides the sequential line number indicating the position of this specific financial impact within the
      journal entry.
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryLineLigneDCriture} has line number {Integer}'
  - name: chart_of_accounts_entry
    roles:
    - concept: ChartOfAccountsEntry
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryLineLigneDCriture} has {ChartOfAccountsEntry}'
  - name: accounting_entry_criture_comptable
    roles:
    - concept: AccountingEntryCritureComptable
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryLineLigneDCriture} has {AccountingEntryCritureComptable}'
  - name: third_party_tiers
    roles:
    - concept: ThirdPartyTiers
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryLineLigneDCriture} has {ThirdPartyTiers}'
  - name: vat_rate
    roles:
    - concept: VatRate
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryLineLigneDCriture} has {VatRate}'
  - name: analytical_centre
    roles:
    - concept: AnalyticalCentre
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingEntryLineLigneDCriture} has {AnalyticalCentre}'
- concept: AccountingJournal
  type: EntityType
  description: A single entity representing an accounting journal with its unique identifier, descriptive label, and functional
    type.
  identify_by:
  - journal_code
  relationships:
  - name: journal_type
    description: Indicates the functional category of the journal, such as sales, purchases, or financial, to define its operational
      purpose.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingJournal} has journal type {String}'
  - name: journal_label
    description: Provides the descriptive label and context for the journal, specifying details like data source or period
      coverage.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{AccountingJournal} has journal label {String}'
  - name: journal_code
    description: Identifies the accounting journal by a unique short alphanumeric code, such as AN or VEN, used to classify
      specific transaction entries.
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - '{AccountingJournal} is identified by journal code {String}'
- concept: AnalyticalCentre
  type: EntityType
  description: A specific department or organizational unit within the company, including its identifier, label, and operational
    status.
  identify_by:
  - centre_code
  relationships:
  - name: centre_code
    description: Stores the alphanumeric identifier of the department or unit, which is referenced by budget, asset, and journal
      entry records.
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - '{AnalyticalCentre} is identified by centre code {String}'
  - name: active_status
    description: Indicates whether the organizational unit is currently operational, with true signifying active status.
    roles:
    - concept: Boolean
    multiplicity: ManyToOne
    verbalizes:
    - '{AnalyticalCentre} has active status {Boolean}'
  - name: site
    description: Specifies the location or facility code associated with the unit, using codes like NAM or SEN.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{AnalyticalCentre} has site {String}'
  - name: centre_label
    description: Provides the human-readable name of the organizational unit, such as General Direction or Finance and Accounting.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{AnalyticalCentre} has centre label {String}'
- concept: ArticleArticleProduit
  type: EntityType
  description: 'Les 62 articles. art_type (par_code TYPE_ART) : PF = produit fini fabriqué (les 8 pompes à chaleur Aéris et
    groupes Ventis : « produits finis »), NEG = négoce, COMP = composant, MP = matière première, SRV = prestation. art_ligne
    et sit_id_prod : ligne et usine de production des produits finis.'
  identify_by:
  - article_identifier
  relationships:
  - name: standard_packaging_quantity
    description: The quantity of units included in one standard packaging or order condition, expressed as a numeric integer.
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - '{ArticleArticleProduit} has standard packaging quantity {Decimal}'
  - name: is_available_for_sale
    description: A boolean flag indicating whether the product is currently available for sale to customers.
    roles:
    - concept: Boolean
    multiplicity: ManyToOne
    verbalizes:
    - '{ArticleArticleProduit} has is available for sale {Boolean}'
  - name: creation_date
    description: The date the product record was created, formatted as YYYY-MM-DD.
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - '{ArticleArticleProduit} has creation date {Date}'
  - name: is_active
    description: A boolean flag indicating whether the product record is currently active and valid in the system.
    roles:
    - concept: Boolean
    multiplicity: ManyToOne
    verbalizes:
    - '{ArticleArticleProduit} has is active {Boolean}'
  - name: standard_selling_price
    description: The standard selling price of the product, recorded as a numeric monetary value.
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - '{ArticleArticleProduit} has standard selling price {Decimal}'
  - name: article_identifier
    description: Uniquely identifies the product article, serving as the primary key for related records like nomenclature
      and pricing.
    roles:
    - concept: Integer
    multiplicity: OneToOne
    verbalizes:
    - '{ArticleArticleProduit} is identified by article identifier {Integer}'
  - name: weight_in_kilograms
    description: The physical weight of the product measured in kilograms, expressed as a numeric decimal value.
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - '{ArticleArticleProduit} has weight in kilograms {Decimal}'
  - name: product_category_code
    description: A classification code indicating the product's nature, such as component, negative item, or service, using
      values like COMP or SRV.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{ArticleArticleProduit} has product category code {String}'
  - name: product_sku_code
    description: The alphanumeric SKU code assigned to the product, formatted as letters followed by digits, such as AE06.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{ArticleArticleProduit} has product sku code {String}'
  - name: product_model_label
    description: A descriptive text label identifying the specific model or variant of the product, such as Pompe à chaleur
      Aéris 6.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{ArticleArticleProduit} has product model label {String}'
  - name: product_line_code
    description: A code representing the specific product line or series to which the article belongs, such as L1 or V2.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{ArticleArticleProduit} has product line code {String}'
  - name: unit_of_measure
    description: The unit of measure used for billing or inventory, represented by codes like PCE for pieces or JOUR for days.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{ArticleArticleProduit} has unit of measure {String}'
  - name: is_held_in_inventory
    description: A boolean flag indicating whether the product is held in physical inventory for stock management.
    roles:
    - concept: Boolean
    multiplicity: ManyToOne
    verbalizes:
    - '{ArticleArticleProduit} has is held in inventory {Boolean}'
  - name: supplier_fournisseur
    roles:
    - concept: SupplierFournisseur
    multiplicity: ManyToOne
    verbalizes:
    - '{ArticleArticleProduit} has {SupplierFournisseur}'
  - name: site
    roles:
    - concept: Site
    multiplicity: ManyToOne
    verbalizes:
    - '{ArticleArticleProduit} has {Site}'
  - name: product_family
    roles:
    - concept: ProductFamily
    multiplicity: ManyToOne
    verbalizes:
    - '{ArticleArticleProduit} has {ProductFamily}'
- concept: BankAccount
  type: EntityType
  description: Represents a specific financial account held by the organization, identified by a unique bank code and associated
    with a specific currency.
  identify_by:
  - bank_code
  relationships:
  - name: account_label
    description: Provides a human-readable description of the bank account, including the bank name and account type.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{BankAccount} has account label {String}'
  - name: iban
    description: Uniquely identifies the bank account using an International Bank Account Number formatted with spaces, such
      as 'BE68 5390 0754 7034'.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{BankAccount} has iban {String}'
  - name: currency
    description: Specifies the ISO 4217 currency code in which the bank account is denominated.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{BankAccount} has currency {String}'
  - name: bank_code
    description: Identifies the specific bank holding the account, linking it to associated banking movements.
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - '{BankAccount} is identified by bank code {String}'
  - name: chart_of_accounts_entry
    roles:
    - concept: ChartOfAccountsEntry
    multiplicity: ManyToOne
    verbalizes:
    - '{BankAccount} has {ChartOfAccountsEntry}'
- concept: BankMovement
  type: EntityType
  description: Records individual financial transactions within a bank account, including details on amounts, counterparties,
    and reconciliation status.
  relationships:
  - name: operation_type
    description: Classifies the transaction category, such as SEPA transfers or account fees.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{BankMovement} has operation type {String}'
  - name: value_date
    description: Indicates the settlement value date of the transaction in YYYY-MM-DD format.
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - '{BankMovement} has value date {Date}'
  - name: operation_date
    description: Records the execution date of the transaction in YYYY-MM-DD format.
    roles:
    - concept: Date
    multiplicity: ManyToOne
    verbalizes:
    - '{BankMovement} has operation date {Date}'
  - name: movement_id
    description: Uniquely identifies each recorded financial transaction within the bank movement history.
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{BankMovement} has movement id {Integer}'
  - name: counterparty_iban
    description: Stores the International Bank Account Number (IBAN) of the transaction counterparty.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{BankMovement} has counterparty iban {String}'
  - name: counterparty_name
    description: Specifies the name of the external entity involved as the counterparty in the transaction.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{BankMovement} has counterparty name {String}'
  - name: amount
    description: Represents the monetary value of the transaction, where positive figures are credits and negative figures
      are debits.
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - '{BankMovement} has amount {Decimal}'
  - name: communication
    description: Contains the reference text or memo associated with the payment, such as invoice details.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{BankMovement} has communication {String}'
  - name: reconciliation_status
    description: Indicates whether the transaction is reconciled or pending reconciliation.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{BankMovement} has reconciliation status {String}'
  - name: accounting_entry_criture_comptable
    roles:
    - concept: AccountingEntryCritureComptable
    multiplicity: ManyToOne
    verbalizes:
    - '{BankMovement} has {AccountingEntryCritureComptable}'
  - name: bank_account
    roles:
    - concept: BankAccount
    multiplicity: ManyToOne
    verbalizes:
    - '{BankMovement} has {BankAccount}'
- concept: Budget2026
  type: EntityType
  description: 'Budget 2026 par compte et par mois, montant positif pour les charges comme pour les produits. Plusieurs versions
    (V1, V2, FINAL) : seule FINAL est approuvée.'
  relationships:
  - name: budget_identifier
    description: Uniquely identifies each specific financial budget allocation record.
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{Budget2026} has budget identifier {Integer}'
  - name: month
    description: Represents the calendar month number associated with the specific budget entry as an integer.
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{Budget2026} has month {Integer}'
  - name: budget_version
    description: Indicates the specific document iteration or status, using codes like V1, V2, or FINAL.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{Budget2026} has budget version {String}'
  - name: budget_amount
    description: Stores the financial budget value allocated for the specific month and document version.
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - '{Budget2026} has budget amount {Decimal}'
  - name: analytical_centre
    roles:
    - concept: AnalyticalCentre
    multiplicity: ManyToOne
    verbalizes:
    - '{Budget2026} has {AnalyticalCentre}'
  - name: fiscal_year
    roles:
    - concept: FiscalYear
    multiplicity: ManyToOne
    verbalizes:
    - '{Budget2026} has {FiscalYear}'
  - name: chart_of_accounts_entry
    roles:
    - concept: ChartOfAccountsEntry
    multiplicity: ManyToOne
    verbalizes:
    - '{Budget2026} has {ChartOfAccountsEntry}'
- concept: ChartOfAccountsEntry
  type: EntityType
  description: A record representing a specific account within the company's general ledger or chart of accounts.
  identify_by:
  - account_number
  relationships:
  - name: account_type
    description: Functional type defining the account nature as a balance sheet item, expense, or revenue.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{ChartOfAccountsEntry} has account type {String}'
  - name: analytical_account_required
    description: Boolean flag specifying whether the account requires the use of an analytical sub-account.
    roles:
    - concept: Boolean
    multiplicity: ManyToOne
    verbalizes:
    - '{ChartOfAccountsEntry} has analytical account required {Boolean}'
  - name: account_number
    description: Unique alphanumeric identifier for the account, referencing budgets, bank accounts, assets, journal lines,
      and tax rates.
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - '{ChartOfAccountsEntry} is identified by account number {String}'
  - name: account_class
    description: Integer class code ranging from one to seven that categorizes the account within the accounting framework.
    roles:
    - concept: Integer
    multiplicity: ManyToOne
    verbalizes:
    - '{ChartOfAccountsEntry} has account class {Integer}'
  - name: account_label
    description: Descriptive label identifying the specific account name within the chart of accounts, such as Capital or
      Reserves.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{ChartOfAccountsEntry} has account label {String}'
  - name: active_status
    description: Boolean flag indicating whether the account is currently active and enabled for use.
    roles:
    - concept: Boolean
    multiplicity: ManyToOne
    verbalizes:
    - '{ChartOfAccountsEntry} has active status {Boolean}'
  - name: letterable
    description: Boolean flag indicating whether the account supports the lettering process for matching transactions.
    roles:
    - concept: Boolean
    multiplicity: ManyToOne
    verbalizes:
    - '{ChartOfAccountsEntry} has letterable {Boolean}'
- concept: CostCenter
  type: EntityType
  description: Organizational unit used for cost allocation and financial reporting.
  identify_by:
  - cost_center_code
  relationships:
  - name: general_ledger_cost_center
    description: Represents the cost center as an alphanumeric General Ledger code, like NAM-DIR, used specifically for financial
      reporting purposes.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{CostCenter} has general ledger cost center {String}'
  - name: cost_center_code
    description: Identifies the organizational unit for cost allocation, stored as a numeric code such as 110, and links departments
      and payslips to their respective cost centers.
    roles:
    - concept: String
    multiplicity: OneToOne
    verbalizes:
    - '{CostCenter} is identified by cost center code {String}'
  - name: name
    description: Provides the descriptive title of the organizational unit, such as Direction générale, used for identifying
      specific departments within the cost center structure.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{CostCenter} has name {String}'
  - name: work_site
    roles:
    - concept: WorkSite
    multiplicity: ManyToOne
    verbalizes:
    - '{CostCenter} has {WorkSite}'
- concept: CustomerClient
  type: EntityType
  description: 'Clients : distributeurs, installateurs, promoteurs (par_code CLI_TYPE). cli_tva (format BE0123456789) relie
    au tiers de la comptabilité, qui l''écrit ''BE 0123.456.789''.'
  identify_by:
  - client_id
  relationships:
  - name: client_id
    description: Uniquely identifies the client entity, serving as the key for related tariff, certificate, and invoice records.
    roles:
    - concept: Integer
    multiplicity: OneToOne
    verbalizes:
    - '{CustomerClient} is identified by client id {Integer}'
  - name: client_code
    description: Alphanumeric code identifying the client, formatted as 'CL' followed by a five-digit number.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{CustomerClient} has client code {String}'
  - name: vat_number
    description: Value Added Tax registration number for the client, prefixed by the relevant country code.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{CustomerClient} has vat number {String}'
  - name: discount_percentage
    description: Percentage discount or rebate applied to transactions with this specific client.
    roles:
    - concept: Decimal
    multiplicity: ManyToOne
    verbalizes:
    - '{CustomerClient} has discount percentage {Decimal}'
  - name: client_type
    description: Business role classification of the client, categorized as institutional, distributor, or promoter.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{CustomerClient} has client type {String}'
  - name: country
    description: Two-letter country code indicating the client's country of operation.
    roles:
    - concept: String
    multiplicity: ManyToOne
    verbalizes:
    - '{CustomerClient} has country {String}'
  - name: client_name
    description: Official legal or commercial name of the client organization, such as a company's registered name.
    roles:
    - concept: String

    "use_in_join_paths": true}], "sql_attributes": {"bridge_table": [], "manual": [{"description": "Comptes 70, crédit moins
    débit, écritures VALIDEE. Filtrer la période sur ecriture.code_periode.", "id": "8cca608c-95dc-4ce3-a884-1470d5e114f9",
    "name": "Booked revenue (chiffre d''affaires comptable)", "sql": "SELECT SUM(l.credit - l.debit) AS chiffre_affaires_comptable\nFROM
    public.ligne_ecriture l JOIN public.ecriture e ON e.id_ecriture = l.id_ecriture\nWHERE e.statut = ''VALIDEE'' AND l.numero_compte
    LIKE ''70%''", "sql_column_is": ["cd36a3c6-6696-4c94-bb19-c1c6ae421667", "b39889b0-efc6-49c6-b47e-4d906d65b94c", "476f02d5-6f6e-4428-92b0-cbc326bc21a0",
    "466b82cc-468f-400f-9b19-c5a810f61a40", "3bb3cf6d-11f7-4926-bc93-d36974d6254d", "3ecceed6-241e-48a5-8d64-c42b487833c9"],
    "term_id": "594ff843-0371-4977-8014-5e283b2864e9"}, {"description": "Compte 630000, débit moins crédit, écritures VALIDEE
    (égal au total du registre amortissement).", "id": "fb2756e7-a413-46a1-80e4-923f6422376f", "name": "Depreciation expense
    (dotations aux amortissements)", "sql": "SELECT SUM(l.debit - l.credit) AS amortissements\nFROM public.ligne_ecriture
    l JOIN public.ecriture e ON e.id_ecriture = l.id_ecriture\nWHERE e.statut = ''VALIDEE'' AND l.numero_compte = ''630000''",
    "sql_column_is": ["cd36a3c6-6696-4c94-bb19-c1c6ae421667", "b39889b0-efc6-49c6-b47e-4d906d65b94c", "476f02d5-6f6e-4428-92b0-cbc326bc21a0",
    "466b82cc-468f-400f-9b19-c5a810f61a40", "3bb3cf6d-11f7-4926-bc93-d36974d6254d", "3ecceed6-241e-48a5-8d64-c42b487833c9"],
    "term_id": "594ff843-0371-4977-8014-5e283b2864e9"}, {"description": "Résultat d''exploitation avant amortissements et
    provisions : comptes 60, 61, 62, 64 et 70 à 74 (crédit moins débit), écritures VALIDEE. Exclut 63 (amortissements, provisions
    et leurs reprises), 65 (intérêts, frais bancaires), 66, 67 (impôts) et 69. Marge d''EBITDA = EBITDA / comptes 70.", "id":
    "c97490cf-1d49-4046-9fe5-de56d47a4f53", "name": "EBITDA", "sql": "SELECT SUM(l.credit - l.debit) FILTER (WHERE left(l.numero_compte,
    2) IN (''60'',''61'',''62'',''64'',''70'',''71'',''72'',''73'',''74'')) AS ebitda,\n       SUM(l.credit - l.debit) FILTER
    (WHERE left(l.numero_compte, 2) = ''70'') AS chiffre_affaires\nFROM public.ligne_ecriture l JOIN public.ecriture e ON
    e.id_ecriture = l.id_ecriture\nWHERE e.statut = ''VALIDEE''", "sql_column_is": ["cd36a3c6-6696-4c94-bb19-c1c6ae421667",
    "b39889b0-efc6-49c6-b47e-4d906d65b94c", "476f02d5-6f6e-4428-92b0-cbc326bc21a0", "466b82cc-468f-400f-9b19-c5a810f61a40",
    "3bb3cf6d-11f7-4926-bc93-d36974d6254d", "3ecceed6-241e-48a5-8d64-c42b487833c9"], "term_id": "594ff843-0371-4977-8014-5e283b2864e9"},
    {"description": "Personnes distinctes sous contrat à une date (ici le 31/05/2026, à remplacer), par site via le département.",
    "id": "5abaf87c-19da-4ea5-ad75-7c89f6f843b5", "name": "Headcount on a date (effectif)", "sql": "SELECT d.site_code, COUNT(DISTINCT
    c.employee_id) AS personnes\nFROM public.contracts c JOIN public.departments d ON d.department_code = c.department_code\nWHERE
    c.start_date <= DATE ''2026-05-31'' AND (c.end_date IS NULL OR c.end_date >= DATE ''2026-05-31'')\nGROUP BY d.site_code",
    "sql_column_is": ["44cc110a-2818-49ea-8233-2e8e87e90baa", "41d9969e-2a94-47c3-8633-cbea8da4cc37", "8e324d62-67e0-4fbf-b4de-f6bc4db2d04c",
    "bcf5a501-f44e-46c9-8799-beab772052cc", "b4863269-c273-4b51-b9c3-7be2a5c889ca", "e5c8d8ef-9c7a-4c70-aa6e-3afb482c8b85"],
    "term_id": "2adf294e-dd64-44b3-9d0e-2127c890b3a3"}, {"description": "Factures moins avoirs, hors taxes, sur fac_dt. Filtrer
    la période sur fac_dt.", "id": "7f9468a2-c3af-4aee-b3d8-e643164b5afd", "name": "Net invoiced revenue (chiffre d''affaires
    net facturé HT)", "sql": "SELECT SUM(CASE WHEN fac_type = ''A'' THEN -fac_mt_ht ELSE fac_mt_ht END) AS chiffre_affaires_net_ht\nFROM
    dbo.vte_fact", "sql_column_is": ["47c3e312-1045-4b59-90e5-fe6068497696", "e6c9dddd-df5c-40bc-b021-25555d657f64"], "term_id":
    "9293d0aa-05a7-4e90-be4e-efb6f46a88c3"}, {"description": "Produits (classe 7) moins charges (classe 6), écritures VALIDEE,
    SANS le compte 693000 : l''écriture d''affectation du résultat (31/12) le ramènerait à zéro. Filtrer l''exercice via periode.code_exercice.",
    "id": "330a0492-dbe9-41a3-b79b-d6a35548c2a8", "name": "Net result (résultat net)", "sql": "SELECT SUM(l.credit - l.debit)
    AS resultat_net\nFROM public.ligne_ecriture l JOIN public.ecriture e ON e.id_ecriture = l.id_ecriture\nWHERE e.statut
    = ''VALIDEE'' AND left(l.numero_compte, 1) IN (''6'', ''7'') AND l.numero_compte <> ''693000''", "sql_column_is": ["cd36a3c6-6696-4c94-bb19-c1c6ae421667",
    "b39889b0-efc6-49c6-b47e-4d906d65b94c", "476f02d5-6f6e-4428-92b0-cbc326bc21a0", "466b82cc-468f-400f-9b19-c5a810f61a40",
    "3bb3cf6d-11f7-4926-bc93-d36974d6254d", "3ecceed6-241e-48a5-8d64-c42b487833c9"], "term_id": "594ff843-0371-4977-8014-5e283b2864e9"},
    {"description": "Lignes de prestation avec work_location = ''TELE'' (une ligne par jour).", "id": "5d3038b5-5320-420b-b62d-0d89ea3563fb",
    "name": "Telework days (jours de télétravail)", "sql": "SELECT COUNT(*) AS jours_teletravail FROM public.timesheets WHERE
    work_location = ''TELE''", "sql_column_is": ["a934760f-d2f8-4218-bb87-a701452a9683"], "term_id": "08ae34af-e177-40a0-b5cd-8e3fbe0e4786"},
    {"description": "Quantités facturées moins les quantités des avoirs de motif RETOUR (pas REGUL_TARIF ni les autres).",
    "id": "0d29cab8-9200-4c0b-bfd5-24f888f35577", "name": "Units sold net of returns (unités vendues)", "sql": "SELECT SUM(CASE
    WHEN f.fac_type = ''F'' THEN l.fl_qte WHEN f.fac_motif = ''RETOUR'' THEN -l.fl_qte ELSE 0 END) AS unites\nFROM dbo.vte_fact_lig

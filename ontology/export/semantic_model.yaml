version: 0.2.0.dev0
name: auto_ontology_model
datasets:
- name: absence_type
  source: paie.public.absence_types
  description: Definitions for different categories of employee absences, including whether they are paid by the employer
    and if meal vouchers apply.
  unique_keys:
  - - absence_code
  fields:
  - name: absence_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: absence_code
    datatype: String
    description: Identifies the specific category of employee absence, serving as a unique reference for timesheet entries.
  - name: label
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: label
    datatype: String
    description: Provides the human-readable business name corresponding to a specific absence code for clear identification.
  - name: paid_by_employer
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: paid_by_employer
    datatype: Boolean
    description: Indicates whether the employer covers the salary costs associated with a specific type of employee absence.
  - name: meal_voucher
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: meal_voucher
    datatype: Boolean
    description: Indicates whether meal vouchers remain valid or payable during a specific category of employee absence.
- name: accounting_entry_écriture_comptable
  source: compta.public.ecriture
  description: 'Écritures (pièces) par journal : VEN ventes (factures de l''ERP), ACH achats, BQ1 banque, SAL salaires, OD
    opérations diverses, AN à-nouveaux (reprise des soldes au 01/01/2025, pas une opération de l''exercice). statut BROUILLARD
    = provisoire, à exclure ; code_periode AAAA-MM.'
  ai_context:
    synonyms:
    - Accounting Entry (écriture comptable)
  unique_keys:
  - - entry_id
  fields:
  - name: user
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: utilisateur
    datatype: String
    description: Identifies the user account or automated process responsible for creating or modifying the entry.
  - name: due_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date_echeance
    datatype: Date
    description: Specifies the due date for settling the financial obligation, formatted as YYYY-MM-DD.
  - name: entry_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date_ecriture
    datatype: Date
    description: Indicates the calendar date the transaction was recorded in the ledger, formatted as YYYY-MM-DD.
  - name: entry_timestamp
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date_saisie
    datatype: DateTime
    description: Records the precise timestamp when the entry was inputted or imported, formatted as YYYY-MM-DD HH:MM:SS.
  - name: status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: statut
    datatype: String
    description: Indicates the entry's processing state, distinguishing between final approved records and drafts.
  - name: external_reference
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: reference_externe
    datatype: String
    description: References the original document number from source systems or partner invoices, like FA25-00012.
  - name: document_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: numero_piece
    datatype: String
    description: Identifies the specific invoice or accounting document via an alphanumeric code, such as AN-2025-00001.
  - name: description
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: libelle
    datatype: String
    description: Provides a textual summary of the transaction nature, such as service interventions or balance carryovers.
  - name: entry_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_ecriture
    datatype: Integer
    description: Uniquely identifies the accounting entry, linking it to associated amortization lines, journal details, and
      bank movements.
  - name: id_tiers
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_tiers
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity": "key_column"}'
  - name: code_periode
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: code_periode
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity": "key_column"}'
  - name: code_journal
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: code_journal
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity": "key_column"}'
- name: accounting_entry_line_ligne_d_écriture
  source: compta.public.ligne_ecriture
  description: 'Lignes des écritures, au débit ou au crédit, montants toujours positifs. Classe du compte = premier chiffre
    de numero_compte : 6 charges (au débit), 7 produits (au crédit), 1 à 5 bilan. Ne compter que les écritures VALIDEE. Le
    compte 693000 (affectation du résultat) n''est pas une charge d''exploitation : il ramène le résultat à zéro en fin d''exercice.'
  ai_context:
    synonyms:
    - Accounting Entry Line (ligne d'écriture)
  fields:
  - name: credit_amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: credit
    datatype: Decimal
    description: Specifies the monetary amount recorded on the credit side of this particular accounting line.
  - name: reconciliation_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: code_lettrage
    datatype: String
    description: Stores the code used for matching or clearing this specific accounting entry line.
  - name: debit_amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: debit
    datatype: Decimal
    description: Specifies the monetary amount recorded on the debit side of this particular accounting line.
  - name: entry_line_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_ligne
    datatype: Integer
    description: Uniquely identifies each individual line within the accounting entry table for technical record tracking.
  - name: description
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: libelle
    datatype: String
    description: Contains the text description or label, such as invoice references, detailing the nature of this specific
      financial line.
  - name: reconciliation_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date_lettrage
    datatype: Date
    description: Records the date in YYYY-MM-DD format when this accounting entry line was matched or cleared.
  - name: line_number
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: numero_ligne
    datatype: Integer
    description: Provides the sequential line number indicating the position of this specific financial impact within the
      journal entry.
  - name: booked_revenue_chiffre_d_affaires_comptable
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(l.credit - l.debit)
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity": "sql_attribute", "id": "8cca608c-95dc-4ce3-a884-1470d5e114f9", "ossie_expression": "SUM(l.credit -
        l.debit)", "sql": "SELECT SUM(l.credit - l.debit) AS chiffre_affaires_comptable\nFROM public.ligne_ecriture l JOIN
        public.ecriture e ON e.id_ecriture = l.id_ecriture\nWHERE e.statut = ''VALIDEE'' AND l.numero_compte LIKE ''70%''",
        "sql_column_is": ["cd36a3c6-6696-4c94-bb19-c1c6ae421667", "b39889b0-efc6-49c6-b47e-4d906d65b94c", "476f02d5-6f6e-4428-92b0-cbc326bc21a0",
        "466b82cc-468f-400f-9b19-c5a810f61a40", "3bb3cf6d-11f7-4926-bc93-d36974d6254d", "3ecceed6-241e-48a5-8d64-c42b487833c9"],
        "sql_source": "manual", "term_id": "594ff843-0371-4977-8014-5e283b2864e9"}'
    description: Comptes 70, crédit moins débit, écritures VALIDEE. Filtrer la période sur ecriture.code_periode.
    ai_context:
      synonyms:
      - Booked revenue (chiffre d'affaires comptable)
  - name: depreciation_expense_dotations_aux_amortissements
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(l.debit - l.credit)
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity": "sql_attribute", "id": "fb2756e7-a413-46a1-80e4-923f6422376f", "ossie_expression": "SUM(l.debit -
        l.credit)", "sql": "SELECT SUM(l.debit - l.credit) AS amortissements\nFROM public.ligne_ecriture l JOIN public.ecriture
        e ON e.id_ecriture = l.id_ecriture\nWHERE e.statut = ''VALIDEE'' AND l.numero_compte = ''630000''", "sql_column_is":
        ["cd36a3c6-6696-4c94-bb19-c1c6ae421667", "b39889b0-efc6-49c6-b47e-4d906d65b94c", "476f02d5-6f6e-4428-92b0-cbc326bc21a0",
        "466b82cc-468f-400f-9b19-c5a810f61a40", "3bb3cf6d-11f7-4926-bc93-d36974d6254d", "3ecceed6-241e-48a5-8d64-c42b487833c9"],
        "sql_source": "manual", "term_id": "594ff843-0371-4977-8014-5e283b2864e9"}'
    description: Compte 630000, débit moins crédit, écritures VALIDEE (égal au total du registre amortissement).
    ai_context:
      synonyms:
      - Depreciation expense (dotations aux amortissements)
  - name: ebitda
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(l.credit - l.debit) FILTER(WHERE LEFT(l.numero_compte, 2) IN ('60', '61', '62', '64', '70', '71',
          '72', '73', '74'))
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity": "sql_attribute", "id": "c97490cf-1d49-4046-9fe5-de56d47a4f53", "ossie_expression": "SUM(l.credit -
        l.debit) FILTER(WHERE LEFT(l.numero_compte, 2) IN (''60'', ''61'', ''62'', ''64'', ''70'', ''71'', ''72'', ''73'',
        ''74''))", "sql": "SELECT SUM(l.credit - l.debit) FILTER (WHERE left(l.numero_compte, 2) IN (''60'',''61'',''62'',''64'',''70'',''71'',''72'',''73'',''74''))
        AS ebitda,\n       SUM(l.credit - l.debit) FILTER (WHERE left(l.numero_compte, 2) = ''70'') AS chiffre_affaires\nFROM
        public.ligne_ecriture l JOIN public.ecriture e ON e.id_ecriture = l.id_ecriture\nWHERE e.statut = ''VALIDEE''", "sql_column_is":
        ["cd36a3c6-6696-4c94-bb19-c1c6ae421667", "b39889b0-efc6-49c6-b47e-4d906d65b94c", "476f02d5-6f6e-4428-92b0-cbc326bc21a0",
        "466b82cc-468f-400f-9b19-c5a810f61a40", "3bb3cf6d-11f7-4926-bc93-d36974d6254d", "3ecceed6-241e-48a5-8d64-c42b487833c9"],
        "sql_source": "manual", "term_id": "594ff843-0371-4977-8014-5e283b2864e9"}'
    description: 'Résultat d''exploitation avant amortissements et provisions : comptes 60, 61, 62, 64 et 70 à 74 (crédit
      moins débit), écritures VALIDEE. Exclut 63 (amortissements, provisions et leurs reprises), 65 (intérêts, frais bancaires),
      66, 67 (impôts) et 69. Marge d''EBITDA = EBITDA / comptes 70.'
  - name: net_result_résultat_net
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(l.credit - l.debit)
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity": "sql_attribute", "id": "330a0492-dbe9-41a3-b79b-d6a35548c2a8", "ossie_expression": "SUM(l.credit -
        l.debit)", "sql": "SELECT SUM(l.credit - l.debit) AS resultat_net\nFROM public.ligne_ecriture l JOIN public.ecriture
        e ON e.id_ecriture = l.id_ecriture\nWHERE e.statut = ''VALIDEE'' AND left(l.numero_compte, 1) IN (''6'', ''7'') AND
        l.numero_compte <> ''693000''", "sql_column_is": ["cd36a3c6-6696-4c94-bb19-c1c6ae421667", "b39889b0-efc6-49c6-b47e-4d906d65b94c",
        "476f02d5-6f6e-4428-92b0-cbc326bc21a0", "466b82cc-468f-400f-9b19-c5a810f61a40", "3bb3cf6d-11f7-4926-bc93-d36974d6254d",
        "3ecceed6-241e-48a5-8d64-c42b487833c9"], "sql_source": "manual", "term_id": "594ff843-0371-4977-8014-5e283b2864e9"}'
    description: 'Produits (classe 7) moins charges (classe 6), écritures VALIDEE, SANS le compte 693000 : l''écriture d''affectation
      du résultat (31/12) le ramènerait à zéro. Filtrer l''exercice via periode.code_exercice.'
    ai_context:
      synonyms:
      - Net result (résultat net)
  - name: numero_compte
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: numero_compte
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity": "key_column"}'
  - name: id_ecriture
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_ecriture
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity": "key_column"}'
  - name: id_tiers
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_tiers
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity": "key_column"}'
  - name: code_tva
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: code_tva
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity": "key_column"}'
  - name: code_centre
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: code_centre
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity": "key_column"}'
- name: accounting_journal
  source: compta.public.journal
  description: A single entity representing an accounting journal with its unique identifier, descriptive label, and functional
    type.
  unique_keys:
  - - journal_code
  fields:
  - name: journal_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: type_journal
    datatype: String
    description: Indicates the functional category of the journal, such as sales, purchases, or financial, to define its operational
      purpose.
  - name: journal_label
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: libelle
    datatype: String
    description: Provides the descriptive label and context for the journal, specifying details like data source or period
      coverage.
  - name: journal_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: code_journal
    datatype: String
    description: Identifies the accounting journal by a unique short alphanumeric code, such as AN or VEN, used to classify
      specific transaction entries.
- name: analytical_centre
  source: compta.public.centre_analytique
  description: A specific department or organizational unit within the company, including its identifier, label, and operational
    status.
  unique_keys:
  - - centre_code
  fields:
  - name: centre_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: code_centre
    datatype: String
    description: Stores the alphanumeric identifier of the department or unit, which is referenced by budget, asset, and journal
      entry records.
  - name: active_status
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: actif
    datatype: Boolean
    description: Indicates whether the organizational unit is currently operational, with true signifying active status.
  - name: site
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: site
    datatype: String
    description: Specifies the location or facility code associated with the unit, using codes like NAM or SEN.
  - name: centre_label
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: libelle
    datatype: String
    description: Provides the human-readable name of the organizational unit, such as General Direction or Finance and Accounting.
- name: article_article_produit
  source: gespro.dbo.art_article
  description: 'Les 62 articles. art_type (par_code TYPE_ART) : PF = produit fini fabriqué (les 8 pompes à chaleur Aéris et
    groupes Ventis : « produits finis »), NEG = négoce, COMP = composant, MP = matière première, SRV = prestation. art_ligne
    et sit_id_prod : ligne et usine de production des produits finis.'
  ai_context:
    synonyms:
    - Article (article, produit)
  unique_keys:
  - - article_identifier
  fields:
  - name: standard_packaging_quantity
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: art_cond
    datatype: Decimal
    description: The quantity of units included in one standard packaging or order condition, expressed as a numeric integer.
  - name: is_available_for_sale
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: art_vendable
    datatype: Boolean
    description: A boolean flag indicating whether the product is currently available for sale to customers.
  - name: creation_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: art_dt_crea
    datatype: Date
    description: The date the product record was created, formatted as YYYY-MM-DD.
  - name: is_active
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: art_actif
    datatype: Boolean
    description: A boolean flag indicating whether the product record is currently active and valid in the system.
  - name: standard_selling_price
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: art_prix_std
    datatype: Decimal
    description: The standard selling price of the product, recorded as a numeric monetary value.
  - name: article_identifier
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: art_id
    datatype: Integer
    description: Uniquely identifies the product article, serving as the primary key for related records like nomenclature
      and pricing.
  - name: weight_in_kilograms
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: art_poids_kg
    datatype: Decimal
    description: The physical weight of the product measured in kilograms, expressed as a numeric decimal value.
  - name: product_category_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: art_type
    datatype: String
    description: A classification code indicating the product's nature, such as component, negative item, or service, using
      values like COMP or SRV.
  - name: product_sku_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: art_code
    datatype: String
    description: The alphanumeric SKU code assigned to the product, formatted as letters followed by digits, such as AE06.
  - name: product_model_label
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: art_lib
    datatype: String
    description: A descriptive text label identifying the specific model or variant of the product, such as Pompe à chaleur
      Aéris 6.
  - name: product_line_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: art_ligne
    datatype: String
    description: A code representing the specific product line or series to which the article belongs, such as L1 or V2.
  - name: unit_of_measure
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: art_unite
    datatype: String
    description: The unit of measure used for billing or inventory, represented by codes like PCE for pieces or JOUR for days.
  - name: is_held_in_inventory
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: art_stocke
    datatype: Boolean
    description: A boolean flag indicating whether the product is held in physical inventory for stock management.
  - name: frn_id_princ
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: frn_id_princ
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity": "key_column"}'
  - name: sit_id_prod
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: sit_id_prod
    datatype: Integer
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity": "key_column"}'
  - name: fam_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: fam_code
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity": "key_column"}'
- name: bank_account
  source: compta.public.compte_bancaire
  description: Represents a specific financial account held by the organization, identified by a unique bank code and associated
    with a specific currency.
  unique_keys:
  - - bank_code
  fields:
  - name: account_label
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: libelle
    datatype: String
    description: Provides a human-readable description of the bank account, including the bank name and account type.
  - name: iban
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: iban
    datatype: String
    description: Uniquely identifies the bank account using an International Bank Account Number formatted with spaces, such
      as 'BE68 5390 0754 7034'.
  - name: currency
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: devise
    datatype: String
    description: Specifies the ISO 4217 currency code in which the bank account is denominated.
  - name: bank_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: code_banque
    datatype: String
    description: Identifies the specific bank holding the account, linking it to associated banking movements.
  - name: numero_compte
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: numero_compte
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity": "key_column"}'
- name: bank_movement
  source: compta.public.mouvement_bancaire
  description: Records individual financial transactions within a bank account, including details on amounts, counterparties,
    and reconciliation status.
  fields:
  - name: operation_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: type_operation
    datatype: String
    description: Classifies the transaction category, such as SEPA transfers or account fees.
  - name: value_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date_valeur
    datatype: Date
    description: Indicates the settlement value date of the transaction in YYYY-MM-DD format.
  - name: operation_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: date_operation
    datatype: Date
    description: Records the execution date of the transaction in YYYY-MM-DD format.
  - name: movement_id
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: id_mouvement
    datatype: Integer
    description: Uniquely identifies each recorded financial transaction within the bank movement history.
  - name: counterparty_iban
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: contrepartie_iban
    datatype: String
    description: Stores the International Bank Account Number (IBAN) of the transaction counterparty.
  - name: counterparty_name
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: contrepartie_nom
    datatype: String
    description: Specifies the name of the external entity involved as the counterparty in the transaction.
  - name: amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: montant
    datatype: Decimal
    description: Represents the monetary value of the transaction, where positive figures are credits and negative figures
      are debits.
  - name: communication
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: communication
    datatype: String
    description: Contains the reference text or memo associated with the payment, such as invoice details.
  - name: reconciliation_status
    expression:

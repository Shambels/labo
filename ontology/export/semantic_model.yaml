    nombre de employee_id DISTINCTS dont une ligne couvre la date (start_date <= date et end_date vide ou >= date). Le site
    vient du département (departments.site_code).'
  ai_context:
    synonyms:
    - Employment Contract (contrat)
  unique_keys:
  - - contract_identifier
  fields:
  - name: contract_identifier
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: contract_id
    datatype: Integer
    description: Identifies the unique employment contract referenced by employee payslip records.
  - name: start_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: start_date
    datatype: Date
    description: Records the official commencement date of the employment agreement in YYYY-MM-DD format.
  - name: telework_allowed
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: telework_allowed
    datatype: Boolean
    description: Indicates whether the employee is authorized to perform their duties remotely from home.
  - name: weekly_hours
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: weekly_hours
    datatype: Decimal
    description: Records the total expected weekly working hours based on the specific work regime.
  - name: end_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: end_date
    datatype: Date
    description: Specifies the actual termination date of the employment contract in YYYY-MM-DD format.
  - name: shift_pattern
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: shift_pattern
    datatype: String
    description: Describes the scheduled working hours classification, such as early, day, or night shift.
  - name: planned_end_date
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: planned_end_date
    datatype: Date
    description: Tracks the originally scheduled expiration date for fixed-term contracts in YYYY-MM-DD format.
  - name: work_regime
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: work_regime
    datatype: Decimal
    description: Indicates the full-time equivalent ratio representing the proportion of standard working time contracted.
  - name: contract_type
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: contract_type
    datatype: String
    description: Classifies the agreement as either an indefinite (CDI) or fixed-term (CDD) employment contract.
  - name: headcount_on_a_date_effectif
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: d.site_code
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity": "sql_attribute", "id": "5abaf87c-19da-4ea5-ad75-7c89f6f843b5", "ossie_expression": "d.site_code",
        "sql": "SELECT d.site_code, COUNT(DISTINCT c.employee_id) AS personnes\nFROM public.contracts c JOIN public.departments
        d ON d.department_code = c.department_code\nWHERE c.start_date <= DATE ''2026-05-31'' AND (c.end_date IS NULL OR c.end_date
        >= DATE ''2026-05-31'')\nGROUP BY d.site_code", "sql_column_is": ["44cc110a-2818-49ea-8233-2e8e87e90baa", "41d9969e-2a94-47c3-8633-cbea8da4cc37",
        "8e324d62-67e0-4fbf-b4de-f6bc4db2d04c", "bcf5a501-f44e-46c9-8799-beab772052cc", "b4863269-c273-4b51-b9c3-7be2a5c889ca",
        "e5c8d8ef-9c7a-4c70-aa6e-3afb482c8b85"], "sql_source": "manual", "term_id": "2adf294e-dd64-44b3-9d0e-2127c890b3a3"}'
    description: Personnes distinctes sous contrat à une date (ici le 31/05/2026, à remplacer), par site via le département.
    ai_context:
      synonyms:
      - Headcount on a date (effectif)
  - name: department_code
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: department_code
    datatype: String
    custom_extensions:
    - vendor_name: NVIDIA_AUTO_ONTOLOGY
      data: '{"entity": "key_column"}'

system:
  parallel_attempts: false

run: 
  generations: 2
  target_lang: fr
  # langproviders:    
  #   - language: en,fr
  #     model_type: local
  #   - language: fr,en
  #     model_type: local


plugins:
  target_name: calorvia-rag
  target_type: rest
  probe_spec: promptinject.HijackHateHumans
  generators:
    rest:
      RestGenerator:
        name: calorvia-rag
        uri: http://localhost:9000/v1/chat/completions
        method: post
        headers:
          Content-Type: application/json
          Authorization: Bearer local
        req_template_json_object:
          messages:
            - role: user
              content: $INPUT
          sources: [docs]
          stream: false
        response_json: true
        response_json_field: $.choices[0].message.content
        request_timeout: 300
        # skip_codes: [422]
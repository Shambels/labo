[project]
name = "labo"
version = "0.1.0"
description = "Two chatbots for the fictional company Calorvia: a RAG over documents, then a text-to-SQL agent"
readme = "README.md"
authors = [
    { name = "Shambels", email = "pinchetti.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepeval>=4.3",
    "docling>=2.94",
    "openai>=3.51.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.9",
    "py3langid>=0.4.0",
    "pydantic-settings>=2.16.3",
    "pymssql>=2.4.6",
    "pymupdf>=2.1",
    "qdrant-client>=1.20.0",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# One project, one package per exercise: rag_calorvia now, text2sql_calorvia in phase B
module-name = ["rag_calorvia", "text2sql_calorvia"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

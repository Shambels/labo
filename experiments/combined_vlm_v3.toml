# experiments/combined_vlm_v3.toml — step 40: combined_complete_top10 + the images read by Qwen3.8-27B with the v3 prompt: each box under its parent (item 7, Q147)
name = "combined_vlm_v3"

[chunking]
max_tokens = 256
context_line = true         # "[PV du CODIR du 13 octobre 2025 · PV_CODIR_2025-10-13 · 00_Direction/CODIR/2025]"
excel = "openpyxl"           # the only change: rows, tables, notes and Excel formats instead of Docling's conversion
vision = true
tables = "markdown"            # the only change from translate_on_demand_10: Docling tables as compact Markdown (step 30f)
vision_max_tokens = 1024     # the only change: 45 of 65 images/pages were cut at 256 tokens, 1 at 1024 (Q056: a name and its manager in two chunks)
issuer = true                # step 34: "· Calorvia SA ·" after the label of Calorvia's own documents (Q077)
vision_prompt = "v3"         # step 40: v2's links, and each box of an org chart under the box it hangs from
vision_model = "qwen3.8-27b" # step 37's VLM

[embedder]
model = "bge-m3"
query_instruction = ""

[search]
method = "hybrid"          # dense, sparse or hybrid
fusion = "rrf"             # hybrid only: rrf or dbsf
rrf_k = 60                 # rrf only
candidates = 30
exclude_status = ["draft", "archive"]   # the only change: Projets_PV, "projet v1", 99_Archives/ stay indexed but are never candidates
top_k = 10                     # step 39: 10 chunks given to the generator
glossary = "prompts/glossary_translation.txt" # the company's words in the translation prompt (step 30b)
translate = ["nl", "en"]       # the question in Dutch and English (step 5b)
translated_search = false      # translations for the reranker only; the search uses the French question (step 30c)

[reranker]
model = "bge-reranker"     # or "none"
query_language = "chunk"       # each non-French chunk scored against the question in its language (step 30a)
translate_window = 10          # translate only when the French top N holds a non-French chunk (step 30d)

[generation]
enabled = true              # false: retrieval only, for experiments the deterministic metrics measure
model = "qwen3.8-27b"       # served name (llama-server -a)
system_prompt = "prompts/tools_complete.txt" # the only change from combined: rule 4 keeps the details the extracts attach to the answer (step 39)
temperature = 0.0
top_p = 1.0
top_k = 40                  # sampling: candidate tokens at each step, not the number of chunks
max_tokens = 512

[tools]
tables = true                # find_tables, describe_table, run_sql on an in-memory SQLite of every indexed workbook table

[sparse]
language = "per_chunk"         # each chunk's BM25 with its language's stemmer (step 5a)

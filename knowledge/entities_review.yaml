# Wrong links made by the merge or by the extraction: GesPro 7 is the ERP Praxio replaces (intranet, "Le projet Atlas
# en 10 questions"), not Praxio; "Conseil" alone and "conseil de surveillance" are not the board's names; "COO, TL"
# and "CFO, LD" are two aliases written as one.
drop_aliases:
  Praxio: [GesPro 7]
  Conseil d'administration: [Conseil, conseil de surveillance]
  Thomas Lambert: ["COO, TL"]
  Laurent Dewit: ["CFO, LD"]


  - id: C01
    category: simple_compta
    split: dev
    behavior: answer
    question: Quel est le chiffre d'affaires comptabilisé du premier trimestre 2026 ?
    expected: 41 398 881,63 €
    reference:
      - source: compta
        sql: >-
          SELECT SUM(l.credit - l.debit) FROM ligne_ecriture l JOIN ecriture e ON e.id_ecriture = l.id_ecriture
          WHERE e.statut = 'VALIDEE' AND l.numero_compte LIKE '70%' AND e.code_periode IN ('2026-01', '2026-02', '2026-03')
  - id: C02
    category: simple_compta
    split: test
    behavior: answer
    question: Combien d'écritures comptables sont encore en brouillard, et pour quel montant total au débit ?
    expected: 12 écritures, 3 860 308,70 €
    reference:
      - source: compta
        sql: >-
          SELECT count(DISTINCT e.id_ecriture), sum(l.debit) FROM ecriture e JOIN ligne_ecriture l ON l.id_ecriture = e.id_ecriture
          WHERE e.statut = 'BROUILLARD'
  - id: C03
    category: simple_compta
    split: dev
    behavior: answer
    question: Combien d'immobilisations sont en service, et pour quelle valeur d'acquisition totale ?
    expected: 22 immobilisations, 48 434 000 €
    reference:
      - source: compta
        sql: SELECT count(*), sum(valeur_acquisition) FROM immobilisation WHERE statut = 'EN_SERVICE'
  - id: C04
    category: simple_compta
    split: test
    behavior: answer
    question: Sur le compte bancaire, combien est entré et combien est sorti en mai 2026 ?
    expected: 15 040 935,34 € entrés, 5 269 553,76 € sortis
    reference:
      - source: compta
        sql: >-
          SELECT sum(montant) FILTER (WHERE montant > 0), sum(montant) FILTER (WHERE montant < 0), sum(montant)
          FROM mouvement_bancaire WHERE date_operation >= '2026-05-01' AND date_operation < '2026-06-01'
  - id: C05
    category: simple_compta
    split: dev
    behavior: answer
    question: Combien de charges de rémunération (comptes 62) ont été comptabilisées sur l'exercice 2025 ?
    expected: 36 808 653,95 €
    reference:
      - source: compta
        sql: >-
          SELECT SUM(l.debit - l.credit) FROM ligne_ecriture l JOIN ecriture e ON e.id_ecriture = l.id_ecriture
          JOIN periode p ON p.code_periode = e.code_periode
          WHERE e.statut = 'VALIDEE' AND l.numero_compte LIKE '62%' AND p.code_exercice = '2025'
  - id: C06
    category: simple_compta
    split: test
    behavior: answer
    question: Quel chiffre d'affaires le budget 2026 approuvé prévoit-il pour l'année ?
    expected: 156 000 000,03 €
    reference:
      - source: compta
        sql: SELECT sum(montant) FROM budget WHERE version = 'FINAL' AND code_exercice = '2026' AND numero_compte LIKE '70%'


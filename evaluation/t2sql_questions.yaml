  - id: P04
    category: simple_paie
    split: test
    behavior: answer
    question: Combien de personnes sont sous contrat à durée déterminée au 31 mai 2026 ?
    expected: 12 personnes
    reference:
      - source: paie
        sql: >-
          SELECT count(DISTINCT employee_id) FROM contracts WHERE contract_type = 'CDD'
          AND start_date <= '2026-05-31' AND (end_date IS NULL OR end_date >= '2026-05-31')
  - id: P05
    category: simple_paie
    split: dev
    behavior: answer
    question: Quel est le salaire brut moyen par site sur la paie de mai 2026 ?
    expected: Gand 3 553,58 €, Herstal 2 847,68 €, Namur 7 761,95 €, Seneffe 3 288,39 €
    reference:
      - source: paie
        sql: >-
          SELECT d.site_code, count(DISTINCT p.employee_id), round(avg(p.gross_amount), 2)
          FROM payslips p JOIN payroll_runs r ON r.run_id = p.run_id JOIN contracts c ON c.contract_id = p.contract_id
